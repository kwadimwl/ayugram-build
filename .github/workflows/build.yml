name: Build AyuGram for Arch/CachyOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Build package in Arch Linux container
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" archlinux:latest bash -euxc '
            pacman -Syu --noconfirm --needed base-devel git
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            sed -i "s/^#\?MAKEFLAGS=.*/MAKEFLAGS=\"-j$(nproc)\"/" /etc/makepkg.conf
            sed -i "s/^OPTIONS=(\(.*\)debug/OPTIONS=(\1!debug/" /etc/makepkg.conf
            sed -i "/^OPTIONS=/s/ lto/ !lto/" /etc/makepkg.conf
            grep ^OPTIONS= /etc/makepkg.conf
            su builder -c "cd ~ && git clone https://aur.archlinux.org/ayugram-desktop.git && cd ayugram-desktop && makepkg -s --noconfirm"
            cp /home/builder/ayugram-desktop/*.pkg.tar.zst /out/
          '
          ls -lh out

      - name: Read version
        id: ver
        run: echo "file=$(ls out/*.pkg.tar.zst | head -1 | xargs basename)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.file }}
          name: ${{ steps.ver.outputs.file }}
          files: out/*.pkg.tar.zst
